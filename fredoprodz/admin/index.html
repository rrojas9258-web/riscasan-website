<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Fredo Prodz — Administration</title><style>body{margin:0;background:#090909;color:#fff;font:16px/1.6 system-ui,sans-serif}*{box-sizing:border-box}.wrap{max-width:860px;margin:5vh auto;padding:24px}.button{background:#c22;color:white;border:0;padding:12px 20px;border-radius:10px;cursor:pointer}.button.outline{background:transparent;border:1px solid #888}.muted,.small{color:#bbb}.admin-inline{display:flex;flex-wrap:wrap;gap:12px}.admin-inline input{flex:1;min-width:180px;padding:12px;background:#161616;color:white;border:1px solid #666;border-radius:8px}.fp-admin{padding:32px 0;background:#090909;border-top:1px solid #ffffff24}.admin-disclosure{border:1px solid #ffffff30;border-radius:12px;background:#151515;max-width:740px;margin:0 auto}.admin-disclosure summary{cursor:pointer;padding:16px 22px;font-weight:750;list-style-position:inside}.admin-inner{padding:8px 22px 25px}.admin-inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}.admin-inline input{flex:1;min-width:190px;padding:13px 14px;border:1px solid #777;background:#090909;color:#fff;border-radius:10px;font-size:16px}.admin-inner label{display:block;margin-top:18px}.admin-inner h2{font-size:28px}.admin-inner button{font:inherit;cursor:pointer}.admin-inner .button{font-weight:700}
</style></head><body><main><section id="admin" class="fp-admin"><div class="wrap"><details class="admin-disclosure"><summary>Admin <span aria-hidden="true">🔒</span></summary><div class="admin-inner"><h2>Fredo Prodz — Hosting</h2><p class="muted">Espace privé de gestion · Accès réservé</p><form id="fp-admin-form"><label for="fp-admin-password">Mot de passe administrateur</label><div class="admin-inline"><input id="fp-admin-password" type="password" required autocomplete="off" placeholder="Password" /><button type="submit" class="button">Ouvrir</button></div></form><p id="fp-admin-message" role="status" aria-live="polite" class="small"></p><div id="fp-admin-content" hidden><h3>Hébergement mensuel</h3><p><strong>$15 USD / mois</strong></p><p class="small">Le lien de paiement Stripe sera disponible après sa configuration sur le compte de facturation approprié.</p><p id="fp-admin-payment">Lien Stripe : en attente de configuration.</p><button type="button" id="fp-admin-lock" class="button outline">Verrouiller</button></div></div></details></div></section></main><script>
(()=>{const form=document.getElementById('fp-admin-form');if(!form)return;const result=document.getElementById('fp-admin-content'),msg=document.getElementById('fp-admin-message'),password=document.getElementById('fp-admin-password');form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Vérification…';try{const response=await fetch('https://utpprhmhbnioisavfdst.supabase.co/functions/v1/fredoprodz-admin-access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});const data=await response.json();password.value='';if(!response.ok||!data.ok)throw new Error(data.error||'Accès refusé');form.hidden=true;result.hidden=false;msg.textContent='Accès autorisé';}catch(err){result.hidden=true;msg.textContent=err.message||'Erreur de connexion'}});document.getElementById('fp-admin-lock').addEventListener('click',()=>{result.hidden=true;form.hidden=false;password.value='';msg.textContent='';});})();
</script></body></html>
