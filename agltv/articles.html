<!doctype html><html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nouvèl | AGL Télévision</title><meta name="description" content="AGL Télévision: nouvèl verifye an kreyòl, anglè, panyòl ak fransè."><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#17243b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#091d3e;color:white;padding:18px 5%}.nav{max-width:1040px;margin:auto;display:flex;gap:16px;align-items:center;justify-content:space-between}.logo{font-weight:900;letter-spacing:.12em;font-size:1.15rem}.nav a{color:white;text-decoration:none}select{padding:10px;border:1px solid #b5d3ee;border-radius:7px;background:#183d69;color:#fff;font:inherit}main{max-width:920px;margin:auto;padding:44px 20px 90px}h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.1;letter-spacing:-.035em}h2{font-size:1.4rem;line-height:1.35}p{line-height:1.85}.lead{font-size:1.17rem;color:#405574}.panel{background:white;border:1px solid #dfe8f2;border-radius:16px;padding:26px;margin:20px 0;box-shadow:0 12px 34px #1026400a}.top{font-size:.8rem;color:#557399;font-weight:750;letter-spacing:.07em;text-transform:uppercase}a{color:#075aa8}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.list a{text-decoration:none;color:inherit}.list article{height:100%;transition:transform .15s}.list article:hover{transform:translateY(-3px)}.link{display:inline-block;margin-top:10px;color:#075aa8;font-weight:800}.source{font-size:.89rem;background:#eef5fb;padding:15px 17px;border-radius:10px;overflow-wrap:anywhere}.back{display:inline-block;margin:18px 0 5px}footer{background:#091d3e;text-align:center;color:#b7d0ed;padding:26px}.pill{background:#e3effb;color:#154879;padding:6px 10px;border-radius:50px;font-size:.76rem;font-weight:bold}.date{color:#526783;font-size:.87rem}@media(max-width:650px){.list{grid-template-columns:1fr}.panel{padding:22px}.nav{flex-wrap:wrap}}</style></head><body><header><div class="nav"><a href="./" class="logo">AGL TÉLÉVISION</a><a href="./" id="homeLink">Akèy</a><label><span id="languageLabel">Lang</span> <select id="language"><option value="ht">Kreyòl</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option></select></label></div></header><main id="root"></main><footer>AGL TÉLÉVISION · Fenèt ou sou mond lan · © 2026</footer><script>const articles=[{"slug":"haiti-colombia-justice","date":"2026-10-08","source":"Associated Press","url":"https://apnews.com/article/d251c53a30fa6c0dbc57384ba70a8501","country":"🇭🇹 🇨🇴","texts":{"ht":{"title":"Ayiti ak Kolonbi: yon nouvo etap nan dosye asasina Jovenel Moïse","lead":"Gouvènman kolonbyen an anonse asistans pou 17 ansyen militè ki ekstrade Ozetazini nan dosye asasina prezidan ayisyen an.","p":["Prezidan Kolonbi a, Abelardo de la Espriella, anonse sipò legal ak ekonomik pou 17 ansyen militè kolonbyen ki te ekstrade nan Florid, selon Associated Press. Mesye sa yo akize nan kad ankèt sou asasina prezidan Jovenel Moïse, ki te fèt 7 jiyè 2021.","Ansyen militè yo di yo te twonpe yo sou misyon yo te pral fè ann Ayiti. Otorite lajistis ameriken yo ap egzamine patisipasyon moun ki akize yo. Akizasyon pa vle di yon moun deja kondane.","Pou Ayiti, pwosesis jidisyè a enpòtan pou etabli responsabilite yo, respekte dwa tout pati yo epi ede fanmi viktim yo jwenn repons."]},"en":{"title":"Haiti and Colombia: a new phase in the Jovenel Moïse assassination case","lead":"Colombia announces support for 17 former soldiers extradited to the United States in the Haitian president's assassination case.","p":["Colombian President Abelardo de la Espriella announced legal and financial support for 17 former Colombian soldiers extradited to Florida, the Associated Press reported. They face charges related to the July 7, 2021 killing of Haitian President Jovenel Moïse.","The former soldiers say they were misled about their assignment in Haiti. U.S. courts are examining the allegations and each defendant's role. Charges do not constitute a conviction.","For Haiti, the legal proceedings raise important questions about accountability, due process and answers for the victims' families."]},"es":{"title":"Haití y Colombia: nueva etapa en el caso del asesinato de Jovenel Moïse","lead":"Colombia anuncia apoyo a 17 exmilitares extraditados a Estados Unidos por el asesinato del presidente haitiano.","p":["El presidente colombiano, Abelardo de la Espriella, anunció asistencia jurídica y económica para 17 exmilitares extraditados a Florida, según Associated Press. Están acusados en relación con el asesinato del presidente haitiano Jovenel Moïse, ocurrido el 7 de julio de 2021.","Los exmilitares afirman que fueron engañados respecto a su misión en Haití. La justicia estadounidense examina los cargos y el papel atribuido a cada acusado. Una acusación no equivale a una condena.","Para Haití, el proceso judicial es esencial para esclarecer responsabilidades, garantizar el debido proceso y responder a las familias de las víctimas."]},"fr":{"title":"Haïti et Colombie : nouvelle étape dans l'affaire de l'assassinat de Jovenel Moïse","lead":"La Colombie annonce un soutien à 17 anciens militaires extradés vers les États-Unis dans le dossier de l'assassinat du président haïtien.","p":["Le président colombien Abelardo de la Espriella a annoncé une aide juridique et financière à 17 anciens militaires extradés en Floride, selon Associated Press. Ils sont poursuivis dans le cadre de l'assassinat du président haïtien Jovenel Moïse le 7 juillet 2021.","Ces anciens militaires affirment avoir été trompés sur leur mission en Haïti. La justice américaine examine les accusations et le rôle de chacun. Une mise en accusation ne constitue pas une condamnation.","Pour Haïti, la procédure judiciaire pose la question des responsabilités, du respect des droits des accusés et des réponses attendues par les familles des victimes."]}}},{"slug":"dominican-economy","date":"2026-10-08","source":"Banco Central de la República Dominicana","url":"https://www.bancentral.gov.do/a/d/6671-economia-dominicana-registra-crecimiento-interanual-promedio-de-45--en-eneroagosto-de-2026","country":"🇩🇴","texts":{"ht":{"title":"Ekonomi dominikèn nan ogmante 4,5 % ant janvye ak out 2026","lead":"Bank Santral Repiblik Dominikèn rapòte yon kwasans mwayèn 4,5 % nan aktivite ekonomik pandan uit premye mwa ane a.","p":["Dapre done preliminè Bank Santral dominiken an, endikatè mansyèl aktivite ekonomik (IMAE) a te grandi 4,5 % an mwayèn ant janvye ak out 2026. Nan menm peryòd 2025 la, kwasans lan te 2,3 %.","Nan mwa out sèlman, aktivite a te ogmante 3,8 % sou yon ane. Konstriksyon te grandi 7,9 %, sèvis yo 4,1 % epi sèvis finansye yo 9,4 %, dapre bank lan.","Chif sa yo endike ekonomi an ap elaji, men yo pa di poukont yo kijan benefis kwasans lan distribye ant fanmi yo. Travay, pri lavi ak sèvis piblik rete kestyon enpòtan pou popilasyon an."]},"en":{"title":"Dominican economic activity grows 4.5% in January–August 2026","lead":"The Dominican Republic's central bank reports 4.5% average growth in economic activity for the first eight months of the year.","p":["According to preliminary figures from the Dominican central bank, its monthly economic activity indicator (IMAE) increased by an average of 4.5% from January through August 2026, compared with 2.3% over the same period in 2025.","August alone recorded year-over-year growth of 3.8%. Construction expanded 7.9%, services 4.1%, and financial services 9.4%, according to the central bank.","These figures point to an expanding economy but do not, by themselves, show how the gains are shared among households. Jobs, living costs and public services remain crucial questions."]},"es":{"title":"La actividad económica dominicana creció un 4,5 % entre enero y agosto de 2026","lead":"El Banco Central de la República Dominicana informó un crecimiento promedio del 4,5 % en los primeros ocho meses del año.","p":["Según cifras preliminares del Banco Central, el indicador mensual de actividad económica (IMAE) creció un 4,5 % en promedio entre enero y agosto de 2026, frente al 2,3 % del mismo período de 2025.","En agosto, el crecimiento interanual fue del 3,8 %. La construcción avanzó un 7,9 %, los servicios un 4,1 % y los servicios financieros un 9,4 %, de acuerdo con el organismo.","Los datos indican una expansión económica, pero no muestran por sí solos cómo se distribuyen sus beneficios entre los hogares. El empleo, el costo de vida y los servicios públicos siguen siendo aspectos fundamentales."]},"fr":{"title":"L'activité économique dominicaine progresse de 4,5 % de janvier à août 2026","lead":"La Banque centrale de la République dominicaine fait état d'une croissance moyenne de 4,5 % de l'activité au cours des huit premiers mois de l'année.","p":["Selon les chiffres préliminaires de la Banque centrale, l'indicateur mensuel d'activité économique (IMAE) a progressé de 4,5 % en moyenne de janvier à août 2026, contre 2,3 % sur la même période en 2025.","Pour le seul mois d'août, la croissance annuelle s'établit à 3,8 %. La construction a progressé de 7,9 %, les services de 4,1 % et les services financiers de 9,4 %, selon la banque.","Ces résultats témoignent d'une expansion économique sans indiquer à eux seuls comment ses bénéfices profitent aux ménages. L'emploi, le coût de la vie et les services publics restent des enjeux essentiels."]}}},{"slug":"interpol-environment","date":"2026-10-08","source":"INTERPOL","url":"https://www.interpol.int/en/News-and-Events/News/2026/233-arrested-in-environmental-crime-crackdown-in-Latin-America-and-Caribbean","country":"🇨🇴 🌎","texts":{"ht":{"title":"INTERPOL anonse 233 arestasyon kont krim anviwònman nan rejyon an","lead":"Yon operasyon ki kouvri nèf peyi, pami yo Kolonbi ak Repiblik Dominikèn, vize debwazman ak trafik bèt sovaj.","p":["INTERPOL rapòte 233 arestasyon pandan operasyon Madre Tierra VIII, ki te fèt ant 1ye jen ak 31 jiyè 2026 nan nèf peyi Amerik Latin ak Karayib la.","Dapre òganizasyon an, otorite yo idantifye anviwon 60,000 ekta forè ki te debwaze ilegalman epi yo sove plis pase 1,000 bèt vivan. Operasyon an te konsène aktivite tankou eksplwatasyon bwa ilegal, min ilegal ak trafik espès sovaj.","Kolonbi ak Repiblik Dominikèn te patisipe nan operasyon sa a. Rezilta yo montre poukisa kolaborasyon ant peyi yo enpòtan pou konbat rezo ki detwi resous natirèl yo."]},"en":{"title":"INTERPOL reports 233 arrests in regional environmental crime operation","lead":"A nine-country operation, including Colombia and the Dominican Republic, targeted illegal deforestation and wildlife trafficking.","p":["INTERPOL reported 233 arrests during Operation Madre Tierra VIII, conducted between June 1 and July 31, 2026 across nine Latin American and Caribbean countries.","According to the agency, investigators identified about 60,000 hectares of illegally cleared forest and rescued more than 1,000 live animals. The operation addressed illegal logging, mining and wildlife trafficking.","Colombia and the Dominican Republic participated. The findings underscore the importance of cross-border cooperation in tackling networks that exploit natural resources."]},"es":{"title":"INTERPOL comunica 233 detenciones por delitos ambientales en la región","lead":"Una operación en nueve países, entre ellos Colombia y República Dominicana, combatió la deforestación y el tráfico de fauna.","p":["INTERPOL informó de 233 detenciones durante la Operación Madre Tierra VIII, realizada entre el 1 de junio y el 31 de julio de 2026 en nueve países de América Latina y el Caribe.","Según la organización, se identificaron unas 60.000 hectáreas de bosque taladas ilegalmente y se rescataron más de 1.000 animales vivos. La operación abordó la tala y minería ilegales y el tráfico de especies silvestres.","Colombia y República Dominicana participaron en el operativo. Sus resultados destacan la importancia de la cooperación internacional frente a redes que explotan los recursos naturales."]},"fr":{"title":"INTERPOL annonce 233 arrestations liées aux crimes environnementaux","lead":"Une opération dans neuf pays, dont la Colombie et la République dominicaine, a visé la déforestation illégale et le trafic d'espèces sauvages.","p":["INTERPOL a annoncé 233 arrestations dans le cadre de l'opération Madre Tierra VIII, menée du 1er juin au 31 juillet 2026 dans neuf pays d'Amérique latine et des Caraïbes.","Selon l'organisation, les enquêteurs ont recensé environ 60 000 hectares de forêts défrichées illégalement et ont secouru plus de 1 000 animaux vivants. L'opération ciblait notamment l'exploitation forestière illégale, les mines illégales et le trafic d'espèces sauvages.","La Colombie et la République dominicaine ont participé. Ces résultats soulignent l'importance de la coopération transfrontalière dans la lutte contre les réseaux qui pillent les ressources naturelles."]}}},{"slug":"us-market-oil","date":"2026-10-08","source":"Reuters","url":"https://www.reuters.com/business/wall-st-futures-slide-rising-oil-yields-dampen-mood-2026-10-08/","country":"🇺🇸 🌎","texts":{"ht":{"title":"Wall Street fini jounen an melanje pandan pri petwòl ap monte","lead":"S&P 500 ak Nasdaq bese jedi 8 oktòb, pandan Brent ogmante nan yon mache ki enkyè sou enèji ak enflasyon.","p":["Dapre Reuters, endis S&P 500 la bese anviwon 0,5 % jedi 8 oktòb 2026, pandan Nasdaq la pèdi anviwon 1,3 %. Dow Jones la fini ak yon ti ogmantasyon.","Pri petwòl Brent la monte anviwon 4,1 % pandan jounen an. Tansyon nan Mwayen Oryan ak pwoblèm pwodiksyon kontribye nan enkyetid envestisè yo sou enflasyon ak to enterè.","Pou fanmi ak antrepriz nan peyi ki enpòte enèji, gwo mouvman pri petwòl kapab afekte depans transpò ak pri kèk machandiz. Efè reyèl yo depann de plizyè faktè ekonomik."]},"en":{"title":"Wall Street ends mixed as oil prices climb","lead":"The S&P 500 and Nasdaq fell on October 8 while Brent crude rose amid energy and inflation concerns.","p":["Reuters reported that the S&P 500 fell about 0.5% on Thursday, October 8, 2026, while the Nasdaq lost roughly 1.3%. The Dow Jones finished slightly higher.","Brent crude gained about 4.1% during the session. Middle East tensions and production disruptions heightened investor concerns about inflation and interest rates.","For households and businesses in energy-importing economies, sustained oil-price swings can affect transportation expenses and some consumer prices. The actual effects depend on broader economic conditions."]},"es":{"title":"Wall Street cierra con resultados mixtos mientras sube el petróleo","lead":"El S&P 500 y el Nasdaq bajaron el 8 de octubre, mientras el Brent subió entre preocupaciones energéticas e inflacionarias.","p":["Según Reuters, el S&P 500 cayó alrededor de un 0,5 % el jueves 8 de octubre de 2026, mientras que el Nasdaq retrocedió cerca de un 1,3 %. El Dow Jones terminó con una ligera subida.","El crudo Brent avanzó aproximadamente un 4,1 % durante la sesión. Las tensiones en Oriente Medio y los problemas de producción aumentaron la preocupación por la inflación y los tipos de interés.","Para familias y empresas de economías importadoras de energía, las variaciones sostenidas del petróleo pueden afectar el transporte y los precios de ciertos productos. Su impacto real depende de otros factores económicos."]},"fr":{"title":"Wall Street termine en ordre dispersé alors que le pétrole grimpe","lead":"Le S&P 500 et le Nasdaq ont reculé le 8 octobre tandis que le Brent progressait, sur fond d'inquiétudes énergétiques et inflationnistes.","p":["Selon Reuters, le S&P 500 a cédé environ 0,5 % jeudi 8 octobre 2026 et le Nasdaq près de 1,3 %. Le Dow Jones a terminé en légère hausse.","Le Brent a progressé d'environ 4,1 % pendant la séance. Les tensions au Moyen-Orient et les perturbations de production ont ravivé les préoccupations des investisseurs concernant l'inflation et les taux d'intérêt.","Pour les ménages et les entreprises des économies importatrices d'énergie, les fluctuations durables du pétrole peuvent peser sur le transport et certains prix à la consommation. Les effets dépendent toutefois de la conjoncture générale."]}}}];const labels={ht:{home:"Akèy",lang:"Lang",heading:"Nouvèl AGL TV",intro:"Atik orijinal ki baze sou enfòmasyon nou verifye avèk sous endike. Chwazi yon atik pou li li nan lang ou.",read:"Li atik la →",back:"← Tout atik yo",source:"Sous prensipal",note:"Redaksyon AGL TV • 8 oktòb 2026"},en:{home:"Home",lang:"Language",heading:"AGL TV News",intro:"Original reporting based on verified information and attributed sources. Choose a story in your preferred language.",read:"Read story →",back:"← All stories",source:"Primary source",note:"AGL TV Newsroom • October 8, 2026"},es:{home:"Inicio",lang:"Idioma",heading:"Noticias AGL TV",intro:"Artículos originales basados en información verificada y fuentes identificadas. Lee cada noticia en tu idioma.",read:"Leer artículo →",back:"← Todas las noticias",source:"Fuente principal",note:"Redacción AGL TV • 8 de octubre de 2026"},fr:{home:"Accueil",lang:"Langue",heading:"Actualités AGL TV",intro:"Des articles originaux fondés sur des informations vérifiées et des sources citées. Lisez chaque article dans votre langue.",read:"Lire l'article →",back:"← Toutes les actualités",source:"Source principale",note:"Rédaction AGL TV • 8 octobre 2026"}};const root=document.getElementById("root"),select=document.getElementById("language");function el(tag,cls,txt){let e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}function render(){let lang=select.value,l=labels[lang],params=new URLSearchParams(location.search),id=params.get("story"),a=articles.find(x=>x.slug===id);document.documentElement.lang=lang;document.getElementById("homeLink").textContent=l.home;document.getElementById("languageLabel").textContent=l.lang;root.replaceChildren();if(!a){root.append(el("div","top","AGL TÉLÉVISION"),el("h1","",l.heading),el("p","lead",l.intro));let grid=el("div","list");articles.forEach(item=>{let link=el("a");link.href="?story="+encodeURIComponent(item.slug);let box=el("article","panel");box.append(el("div","top",item.country+" · "+item.date),el("h2","",item.texts[lang].title),el("p","",item.texts[lang].lead),el("span","link",l.read));link.append(box);grid.append(link)});root.append(grid);document.title=l.heading+" | AGL Télévision"}else{let back=el("a","back",l.back);back.href="articles.html";let article=el("article","panel");article.append(el("div","top",a.country+" · "+a.date),el("h1","",a.texts[lang].title),el("p","lead",a.texts[lang].lead));a.texts[lang].p.forEach(t=>article.append(el("p","",t)));let source=el("p","source");source.append(document.createTextNode(l.source+": "));let sourceLink=el("a","",a.source);sourceLink.href=a.url;sourceLink.target="_blank";sourceLink.rel="noopener noreferrer";source.append(sourceLink);article.append(source,el("p","date",l.note));root.append(back,article);document.title=a.texts[lang].title+" | AGL Télévision"}}let code="ht";try{const stored=localStorage.getItem("agltv-language");if(["ht","en","es","fr"].includes(stored))code=stored;else{const browser=navigator.language.slice(0,2);if(["en","es","fr"].includes(browser))code=browser}}catch(e){}select.value=code;select.addEventListener("change",()=>{try{localStorage.setItem("agltv-language",select.value)}catch(e){}render()});render();</script></body></html>
