in-top:24px;border-top:1px solid #dce6f0;padding-top:20px;font-size:1.8rem;letter-spacing:.18em;font-weight:900;color:#111722}.agl-signature::after{content:" TÉLÉVISION";font-size:.54rem;letter-spacing:.22em;color:#b30730;margin-left:10px;vertical-align:middle}.share-wrap{margin-top:22px;padding-top:18px;border-top:1px solid #dfe7f1}.share-buttons{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.share-buttons a,.share-buttons button{background:#edf4fc;color:#174675;border:1px solid #cdddeb;border-radius:8px;padding:10px 13px;font:inherit;font-weight:750;text-decoration:none;cursor:pointer}.share-buttons a:hover,.share-buttons button:hover{background:#dcecff}.share-buttons .whatsapp{background:#e0f7e9;color:#116536}.share-buttons .facebook{background:#e4eeff;color:#194b9e}.audio-control{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0;padding:14px;background:#eaf3ff;border-radius:10px}.audio-control button{border:0;background:#135a9c;color:white;border-radius:8px;padding:11px 14px;font:inherit;font-weight:750;cursor:pointer}.audio-control button:last-of-type{background:#435a77}.audio-control small{color:#4a6380}</style></head><body><header><div class="nav"><a href="./" class="logo">AGL TÉLÉVISION</a><a href="./" id="homeLink">Akèy</a><label><span id="languageLabel">Lang</span> <select id="language"><option value="ht">Kreyòl</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option></select></label></div></header><main id="root"></main><footer>AGL TÉLÉVISION · Fenèt ou sou mond lan · © 2026</footer><script>const articles=[{"slug":"haiti-colombia-justice","date":"2026-10-08","source":"Associated Press","url":"https://apnews.com/article/d251c53a30fa6c0dbc57384ba70a8501","country":"🇭🇹 🇨🇴","texts":{"ht":{"title":"Ayiti ak Kolonbi: yon nouvo etap nan dosye asasina Jovenel Moïse","lead":"Gouvènman kolonbyen an anonse asistans pou 17 ansyen militè ki ekstrade Ozetazini nan dosye asasina prezidan ayisyen an.","p":["Prezidan Kolonbi a, Abelardo de la Espriella, anonse sipò legal ak ekonomik pou 17 ansyen militè kolonbyen ki te ekstrade nan Florid, selon Associated Press. Mesye sa yo akize nan kad ankèt sou asasina prezidan Jovenel Moïse, ki te fèt 7 jiyè 2021.","Ansyen militè yo di yo te twonpe yo sou misyon yo te pral fè ann Ayiti. Otorite lajistis ameriken yo ap egzamine patisipasyon moun ki akize yo. Akizasyon pa vle di yon moun deja kondane.","Pou Ayiti, pwosesis jidisyè a enpòtan pou etabli responsabilite yo, respekte dwa tout pati yo epi ede fanmi viktim yo jwenn repons."]},"en":{"title":"Haiti and Colombia: a new phase in the Jovenel Moïse assassination case","lead":"Colombia announces support for 17 former soldiers extradited to the United States in the Haitian president's assassination case.","p":["Colombian President Abelardo de la Espriella announced legal and financial support for 17 former Colombian soldiers extradited to Florida, the Associated Press reported. They face charges related to the July 7, 2021 killing of Haitian President Jovenel Moïse.","The former soldiers say they were misled about their assignment in Haiti. U.S. courts are examining the allegations and each defendant's role. Charges do not constitute a conviction.","For Haiti, the legal proceedings raise important questions about accountability, due process and answers for the victims' families."]},"es":{"title":"Haití y Colombia: nueva etapa en el caso del asesinato de Jovenel Moïse","lead":"Colombia anuncia apoyo a 17 exmilitares extraditados a Estados Unidos por el asesinato del presidente haitiano.","p":["El presidente colombiano, Abelardo de la Espriella, anunció asistencia jurídica y económica para 17 exmilitares extraditados a Florida, según Associated Press. Están acusados en relación con el asesinato del presidente haitiano Jovenel Moïse, ocurrido el 7 de julio de 2021.","Los exmilitares afirman que fueron engañados respecto a su misión en Haití. La justicia estadounidense examina los cargos y el papel atribuido a cada acusado. Una acusación no equivale a una condena.","Para Haití, el proceso judicial es esencial para esclarecer responsabilidades, garantizar el debido proceso y responder a las familias de las víctimas."]},"fr":{"title":"Haïti et Colombie : nouvelle étape dans l'affaire de l'assassinat de Jovenel Moïse","lead":"La Colombie annonce un soutien à 17 anciens militaires extradés vers les États-Unis dans le dossier de l'assassinat du président haïtien.","p":["Le président colombien Abelardo de la Espriella a annoncé une aide juridique et financière à 17 anciens militaires extradés en Floride, selon Associated Press. Ils sont poursuivis dans le cadre de l'assassinat du président haïtien Jovenel Moïse le 7 juillet 2021.","Ces anciens militaires affirment avoir été trompés sur leur mission en Haïti. La justice américaine examine les accusations et le rôle de chacun. Une mise en accusation ne constitue pas une condamnation.","Pour Haïti, la procédure judiciaire pose la question des responsabilités, du respect des droits des accusés et des réponses attendues par les familles des victimes."]}}},{"slug":"dominican-economy","date":"2026-10-08","source":"Banco Central de la República Dominicana","url":"https://www.bancentral.gov.do/a/d/6671-economia-dominicana-registra-crecimiento-interanual-promedio-de-45--en-eneroagosto-de-2026","country":"🇩🇴","texts":{"ht":{"title":"Ekonomi dominikèn nan ogmante 4,5 % ant janvye ak out 2026","lead":"Bank Santral Repiblik Dominikèn rapòte yon kwasans mwayèn 4,5 % nan aktivite ekonomik pandan uit premye mwa ane a.","p":["Dapre done preliminè Bank Santral dominiken an, endikatè mansyèl aktivite ekonomik (IMAE) a te grandi 4,5 % an mwayèn ant janvye ak out 2026. Nan menm peryòd 2025 la, kwasans lan te 2,3 %.","Nan mwa out sèlman, aktivite a te ogmante 3,8 % sou yon ane. Konstriksyon te grandi 7,9 %, sèvis yo 4,1 % epi sèvis finansye yo 9,4 %, dapre bank lan.","Chif sa yo endike ekonomi an ap elaji, men yo pa di poukont yo kijan benefis kwasans lan distribye ant fanmi yo. Travay, pri lavi ak sèvis piblik rete kestyon enpòtan pou popilasyon an."]},"en":{"title":"Dominican economic activity grows 4.5% in January–August 2026","lead":"The Dominican Republic's central bank reports 4.5% average growth in economic activity for the first eight months of the year.","p":["According to preliminary figures from the Dominican central bank, its monthly economic activity indicator (IMAE) increased by an average of 4.5% from January through August 2026, compared with 2.3% over the same period in 2025.","August alone recorded year-over-year growth of 3.8%. Construction expanded 7.9%, services 4.1%, and financial services 9.4%, according to the central bank.","These figures point to an expanding economy but do not, by themselves, show how the gains are shared among households. Jobs, living costs and public services remain crucial questions."]},"es":{"title":"La actividad económica dominicana creció un 4,5 % entre enero y agosto de 2026","lead":"El Banco Central de la República Dominicana informó un crecimiento promedio del 4,5 % en los primeros ocho meses del año.","p":["Según cifras preliminares del Banco Central, el indicador mensual de actividad económica (IMAE) creció un 4,5 % en promedio entre enero y agosto de 2026, frente al 2,3 % del mismo período de 2025.","En agosto, el crecimiento interanual fue del 3,8 %. La construcción avanzó un 7,9 %, los servicios un 4,1 % y los servicios financieros un 9,4 %, de acuerdo con el organismo.","Los datos indican una expansión económica, pero no muestran por sí solos cómo se distribuyen sus beneficios entre los hogares. El empleo, el costo de vida y los servicios públicos siguen siendo aspectos fundamentales."]},"fr":{"title":"L'activité économique dominicaine progresse de 4,5 % de janvier à août 2026","lead":"La Banque centrale de la République dominicaine fait état d'une croissance moyenne de 4,5 % de l'activité au cours des huit premiers mois de l'année.","p":["Selon les chiffres préliminaires de la Banque centrale, l'indicateur mensuel d'activité économique (IMAE) a progressé de 4,5 % en moyenne de janvier à août 2026, contre 2,3 % sur la même période en 2025.","Pour le seul mois d'août, la croissance annuelle s'établit à 3,8 %. La construction a progressé de 7,9 %, les services de 4,1 % et les services financiers de 9,4 %, selon la banque.","Ces résultats témoignent d'une expansion économique sans indiquer à eux seuls comment ses bénéfices profitent aux ménages. L'emploi, le coût de la vie et les services publics restent des enjeux essentiels."]}}},{"slug":"interpol-environment","date":"2026-10-08","source":"INTERPOL","url":"https://www.interpol.int/en/News-and-Events/News/2026/233-arrested-in-environmental-crime-crackdown-in-Latin-America-and-Caribbean","country":"🇨🇴 🌎","texts":{"ht":{"title":"INTERPOL anonse 233 arestasyon kont krim anviwònman nan rejyon an","lead":"Yon operasyon ki kouvri nèf peyi, pami yo Kolonbi ak Repiblik Dominikèn, vize debwazman ak trafik bèt sovaj.","p":["INTERPOL rapòte 233 arestasyon pandan operasyon Madre Tierra VIII, ki te fèt ant 1ye jen ak 31 jiyè 2026 nan nèf peyi Amerik Latin ak Karayib la.","Dapre òganizasyon an, otorite yo idantifye anviwon 60,000 ekta forè ki te debwaze ilegalman epi yo sove plis pase 1,000 bèt vivan. Operasyon an te konsène aktivite tankou eksplwatasyon bwa ilegal, min ilegal ak trafik espès sovaj.","Kolonbi ak Repiblik Dominikèn te patisipe nan operasyon sa a. Rezilta yo montre poukisa kolaborasyon ant peyi yo enpòtan pou konbat rezo ki detwi resous natirèl yo."]},"en":{"title":"INTERPOL reports 233 arrests in regional environmental crime operation","lead":"A nine-country operation, including Colombia and the Dominican Republic, targeted illegal deforestation and wildlife trafficking.","p":["INTERPOL reported 233 arrests during Operation Madre Tierra VIII, conducted between June 1 and July 31, 2026 across nine Latin American and Caribbean countries.","According to the agency, investigators identified about 60,000 hectares of illegally cleared forest and rescued more than 1,000 live animals. The operation addressed illegal logging, mining and wildlife trafficking.","Colombia and the Dominican Republic participated. The findings underscore the importance of cross-border cooperation in tackling networks that exploit natural resources."]},"es":{"title":"INTERPOL comunica 233 detenciones por delitos ambientales en la región","lead":"Una operación en nueve países, entre ellos Colombia y República Dominicana, combatió la deforestación y el tráfico de fauna.","p":["INTERPOL informó de 233 detenciones durante la Operación Madre Tierra VIII, realizada entre el 1 de junio y el 31 de julio de 2026 en nueve países de América Latina y el Caribe.","Según la organización, se identificaron unas 60.000 hectáreas de bosque taladas ilegalmente y se rescataron más de 1.000 animales vivos. La operación abordó la tala y minería ilegales y el tráfico de especies silvestres.","Colombia y República Dominicana participaron en el operativo. Sus resultados destacan la importancia de la cooperación internacional frente a redes que explotan los recursos naturales."]},"fr":{"title":"INTERPOL annonce 233 arrestations liées aux crimes environnementaux","lead":"Une opération dans neuf pays, dont la Colombie et la République dominicaine, a visé la déforestation illégale et le trafic d'espèces sauvages.","p":["INTERPOL a annoncé 233 arrestations dans le cadre de l'opération Madre Tierra VIII, menée du 1er juin au 31 juillet 2026 dans neuf pays d'Amérique latine et des Caraïbes.","Selon l'organisation, les enquêteurs ont recensé environ 60 000 hectares de forêts défrichées illégalement et ont secouru plus de 1 000 animaux vivants. L'opération ciblait notamment l'exploitation forestière illégale, les mines illégales et le trafic d'espèces sauvages.","La Colombie et la République dominicaine ont participé. Ces résultats soulignent l'importance de la coopération transfrontalière dans la lutte contre les réseaux qui pillent les ressources naturelles."]}}},{"slug":"us-market-oil","date":"2026-10-08","source":"Reuters","url":"https://www.reuters.com/business/wall-st-futures-slide-rising-oil-yields-dampen-mood-2026-10-08/","country":"🇺🇸 🌎","texts":{"ht":{"title":"Wall Street fini jounen an melanje pandan pri petwòl ap monte","lead":"S&P 500 ak Nasdaq bese jedi 8 oktòb, pandan Brent ogmante nan yon mache ki enkyè sou enèji ak enflasyon.","p":["Dapre Reuters, endis S&P 500 la bese anviwon 0,5 % jedi 8 oktòb 2026, pandan Nasdaq la pèdi anviwon 1,3 %. Dow Jones la fini ak yon ti ogmantasyon.","Pri petwòl Brent la monte anviwon 4,1 % pandan jounen an. Tansyon nan Mwayen Oryan ak pwoblèm pwodiksyon kontribye nan enkyetid envestisè yo sou enflasyon ak to enterè.","Pou fanmi ak antrepriz nan peyi ki enpòte enèji, gwo mouvman pri petwòl kapab afekte depans transpò ak pri kèk machandiz. Efè reyèl yo depann de plizyè faktè ekonomik."]},"en":{"title":"Wall Street ends mixed as oil prices climb","lead":"The S&P 500 and Nasdaq fell on October 8 while Brent crude rose amid energy and inflation concerns.","p":["Reuters reported that the S&P 500 fell about 0.5% on Thursday, October 8, 2026, while the Nasdaq lost roughly 1.3%. The Dow Jones finished slightly higher.","Brent crude gained about 4.1% during the session. Middle East tensions and production disruptions heightened investor concerns about inflation and interest rates.","For households and businesses in energy-importing economies, sustained oil-price swings can affect transportation expenses and some consumer prices. The actual effects depend on broader economic conditions."]},"es":{"title":"Wall Street cierra con resultados mixtos mientras sube el petróleo","lead":"El S&P 500 y el Nasdaq bajaron el 8 de octubre, mientras el Brent subió entre preocupaciones energéticas e inflacionarias.","p":["Según Reuters, el S&P 500 cayó alrededor de un 0,5 % el jueves 8 de octubre de 2026, mientras que el Nasdaq retrocedió cerca de un 1,3 %. El Dow Jones terminó con una ligera subida.","El crudo Brent avanzó aproximadamente un 4,1 % durante la sesión. Las tensiones en Oriente Medio y los problemas de producción aumentaron la preocupación por la inflación y los tipos de interés.","Para familias y empresas de economías importadoras de energía, las variaciones sostenidas del petróleo pueden afectar el transporte y los precios de ciertos productos. Su impacto real depende de otros factores económicos."]},"fr":{"title":"Wall Street termine en ordre dispersé alors que le pétrole grimpe","lead":"Le S&P 500 et le Nasdaq ont reculé le 8 octobre tandis que le Brent progressait, sur fond d'inquiétudes énergétiques et inflationnistes.","p":["Selon Reuters, le S&P 500 a cédé environ 0,5 % jeudi 8 octobre 2026 et le Nasdaq près de 1,3 %. Le Dow Jones a terminé en légère hausse.","Le Brent a progressé d'environ 4,1 % pendant la séance. Les tensions au Moyen-Orient et les perturbations de production ont ravivé les préoccupations des investisseurs concernant l'inflation et les taux d'intérêt.","Pour les ménages et les entreprises des économies importatrices d'énergie, les fluctuations durables du pétrole peuvent peser sur le transport et certains prix à la consommation. Les effets dépendent toutefois de la conjoncture générale."]}}},{"slug":"agl-iran","date":"2026-10-09","source":"Associated Press","url":"https://apnews.com/article/422b1799a1a06466279ac265f560e014","country":"🌍","texts":{"fr":{"title":"Washington et Téhéran : les discussions au cœur de l'actualité","lead":"Les relations entre les États-Unis et l'Iran suscitent de nouvelles interrogations sur la sécurité régionale.","p":["Selon les informations publiées par Associated Press le 9 octobre 2026, Donald Trump évoque une pause des frappes américaines avant les élections et des discussions avec Téhéran.","La situation reste évolutive. Une annonce politique ne constitue pas un accord définitif : les déclarations doivent être confrontées à l'évolution diplomatique et aux faits sur le terrain.","AGL rappelle que les conséquences humaines, la protection des populations civiles et l'information vérifiée doivent rester au centre de la couverture."]},"en":{"title":"Washington and Tehran: talks draw attention","lead":"U.S.–Iran relations remain under scrutiny.","p":["Associated Press reported statements by Donald Trump on October 9 about strikes and discussions with Tehran.","The situation remains fluid; political statements do not mean a final settlement.","AGL will follow verified diplomatic developments and their effects on civilians."]},"es":{"title":"Washington y Teherán: las conversaciones centran la atención","lead":"Las relaciones entre Estados Unidos e Irán siguen bajo observación.","p":["Associated Press informó el 9 de octubre sobre declaraciones de Donald Trump acerca de ataques y conversaciones con Teherán.","La situación sigue evolucionando; las declaraciones no significan un acuerdo definitivo.","AGL seguirá los acontecimientos diplomáticos confirmados y sus consecuencias humanas."]},"ht":{"title":"Washington ak Teyeran: negosyasyon yo nan nouvèl","lead":"Relasyon Etazini ak Iran kontinye bay anpil kestyon.","p":["Dapre Associated Press 9 oktòb, Donald Trump pale de frap militè ak negosyasyon ak Teyeran.","Sitiyasyon an ka chanje; deklarasyon politik yo pa vle di gen yon akò definitif.","AGL ap suiv devlopman ki verifye ak konsekans yo sou sivil yo."]}}},{"slug":"agl-climate","date":"2026-10-08","source":"Reuters","url":"https://www.reuters.com/business/environment/un-weather-body-says-el-nio-set-intensify-last-until-february-2027-2026-10-08/","country":"🌍","texts":{"fr":{"title":"El Niño pourrait se renforcer au cours des prochains mois","lead":"Un phénomène climatique susceptible d'influencer les pluies et les températures dans plusieurs régions.","p":["Selon une information de Reuters publiée le 8 octobre 2026, l'Organisation météorologique mondiale envisage une intensification d'El Niño et sa persistance jusqu'au début de 2027.","El Niño correspond à un réchauffement anormal d'une partie du Pacifique tropical. Ses effets ne sont pas identiques partout : certaines régions peuvent connaître davantage de pluie et d'autres davantage de sécheresse.","AGL recommande de consulter les services météorologiques locaux pour les prévisions et alertes, car une tendance mondiale ne permet pas de prédire à elle seule la météo de chaque ville."]},"en":{"title":"El Niño could strengthen over coming months","lead":"The climate pattern can affect rainfall and temperatures worldwide.","p":["Reuters reported on October 8 that the World Meteorological Organization expects El Niño to intensify into early 2027.","El Niño is a warming of the tropical Pacific; regional outcomes differ.","Local official forecasts remain essential for weather alerts."]},"es":{"title":"El Niño podría intensificarse en los próximos meses","lead":"El fenómeno puede influir en las lluvias y las temperaturas.","p":["Reuters informó el 8 de octubre sobre previsiones de la Organización Meteorológica Mundial hasta principios de 2027.","El Niño se relaciona con el calentamiento del Pacífico tropical y sus efectos varían según la región.","Para alertas concretas, AGL recomienda consultar servicios meteorológicos oficiales."]},"ht":{"title":"El Niño ka vin pi fò nan mwa k ap vini yo","lead":"Fenomèn sa a kapab chanje kantite lapli ak tanperati nan plizyè rejyon.","p":["Dapre Reuters 8 oktòb, Òganizasyon Meteyowolojik Mondyal la prevwa El Niño ka dire rive nan kòmansman 2027.","Se yon rechofman nan Pasifik twopikal la; efè li diferan selon rejyon yo.","Pou alèt meteyo, AGL konseye suiv sèvis ofisyèl lokal yo."]}}},{"slug":"agl-haiti-security","date":"2026-09-29","source":"Reuters","url":"https://www.reuters.com/world/americas/un-renews-haiti-force-mandate-six-months-after-fresh-gang-killings-2026-09-29/","country":"🇭🇹","texts":{"fr":{"title":"Haïti : le mandat de la force contre les gangs prolongé","lead":"Retour sur une décision du 29 septembre concernant la réponse internationale à l'insécurité.","p":["Reuters a rapporté le 29 septembre 2026 que le Conseil de sécurité des Nations unies a prolongé le mandat de la force internationale intervenant contre les gangs en Haïti.","Cette décision intervient dans un contexte de violences persistantes et de graves besoins humanitaires. Elle porte sur le mandat de la mission et ne signifie pas que la sécurité a été rétablie.","Pour AGL, le suivi doit porter sur la protection des civils, la responsabilité des institutions et les résultats observables. Cet article revient sur une décision antérieure, et non sur une annonce du 9 octobre."]},"en":{"title":"Haiti: anti-gang force mandate extended","lead":"A look back at a September 29 UN Security Council decision.","p":["Reuters reported that the UN Security Council extended the mandate of the international force in Haiti.","The decision came amid sustained violence and urgent humanitarian needs, and does not mean security has been restored.","This is follow-up reporting on an earlier decision, not a new October 9 announcement."]},"es":{"title":"Haití: prorrogan el mandato de la fuerza contra las pandillas","lead":"Seguimiento de una decisión del Consejo de Seguridad del 29 de septiembre.","p":["Reuters informó que la ONU prorrogó el mandato de la fuerza internacional en Haití.","La decisión se produjo en medio de una violencia persistente y necesidades humanitarias graves.","Es un seguimiento de una decisión anterior, no una noticia anunciada el 9 de octubre."]},"ht":{"title":"Ayiti: manda fòs kont gang lan pwolonje","lead":"Yon swivi sou desizyon Konsèy Sekirite 29 septanm lan.","p":["Reuters te rapòte Nasyonzini pwolonje manda fòs entènasyonal la ann Ayiti.","Desizyon an fèt pandan vyolans ak bezwen imanitè yo kontinye; li pa vle di sekirite retabli.","Sa se swivi sou yon desizyon ki te deja fèt, se pa yon nouvo anons 9 oktòb.
