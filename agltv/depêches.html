<!doctype html><html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGL Dépêches Audio</title><style>body{margin:0;font-family:system-ui;background:#eef4fb;color:#13284a}header{background:#081b39;color:#fff;padding:18px 6%}header a{color:#fff;text-decoration:none;font-weight:800}main{max-width:800px;margin:auto;padding:42px 20px}h1{font-size:clamp(2rem,5vw,3rem)}.card{background:#fff;border:1px solid #d7e4f2;border-radius:16px;padding:25px;margin:24px 0}select,button{padding:12px;border-radius:9px;font:inherit}button{background:#115a9e;border:0;color:#fff;font-weight:750;cursor:pointer;margin:5px}button:disabled{opacity:.6}.note{color:#647993;line-height:1.7}footer{text-align:center;padding:30px;background:#081b39;color:#adc8e7}</style></head><body><header><a href="index.html">AGL TÉLÉVISION</a></header><main><h1>🔊 AGL Dépêches Audio</h1><select id="lang" aria-label="Language"><option value="ht">Kreyòl</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option></select><div class="card"><h2 id="title"></h2><p id="message" class="note"></p><button id="jingle" type="button">♫ AGL Jingle</button><button id="listen"></button><button id="stop"></button><p id="status" class="note" role="status"></p></div><p id="disclaimer" class="note"></p></main><footer>AGL — La rédaction</footer><script>const copy={ht:{title:"Dépêches chak èdtan",message:"Premye bilten odyo yo ap disponib isit la apre yo fin verifye epi pibliye. Nou pa gen dépêche pou li otomatikman kounye a.",listen:"▶ Koute dépêche",stop:"■ Kanpe",status:"Pa gen dépêche pibliye pou kounye a.",disclaimer:"Vèsyon sa a prepare sistèm odyo a; yon entegrasyon piblikasyon nesesè pou bilten chak èdtan parèt otomatikman."},en:{title:"Hourly news flashes",message:"Audio bulletins will appear here once verified and published. No bulletin is available for playback yet.",listen:"▶ Listen",stop:"■ Stop",status:"No published bulletins yet.",disclaimer:"Audio interface preview; an editorial publishing integration is required for automatic hourly delivery."},es:{title:"Boletines cada hora",message:"Los boletines de audio aparecerán aquí después de verificarse y publicarse. Aún no hay boletines para reproducir.",listen:"▶ Escuchar",stop:"■ Detener",status:"Aún no hay boletines publicados.",disclaimer:"Vista previa del sistema de audio; se necesita integrar la publicación editorial para actualizar los boletines automáticamente."},fr:{title:"Dépêches chaque heure",message:"Les bulletins audio paraîtront ici après vérification et publication. Aucun bulletin n'est encore disponible à l'écoute.",listen:"▶ Écouter",stop:"■ Arrêter",status:"Aucune dépêche publiée pour le moment.",disclaimer:"Aperçu de l'interface audio ; la publication automatique nécessite une intégration éditoriale."}};const $=s=>document.getElementById(s),select=$("lang");let soundCtx=null;function stopJingle(){if(soundCtx){soundCtx.close().catch(()=>{});soundCtx=null}}function playJingle(){stopJingle();const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C();soundCtx=c;[392,523.25,659.25,783.99].forEach((hz,i)=>{const osc=c.createOscillator(),gain=c.createGain(),at=c.currentTime+.04+i*.19;osc.type="sine";osc.frequency.value=hz;gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.12,at+.018);gain.gain.exponentialRampToValueAtTime(.0001,at+.29);osc.connect(gain).connect(c.destination);osc.start(at);osc.stop(at+.3)});setTimeout(()=>{if(soundCtx===c)soundCtx=null;c.close().catch(()=>{})},1300)}$("jingle").addEventListener("click",playJingle);try{const v=localStorage.getItem("agltv-language");if(copy[v])select.value=v}catch(e){}function show(){if("speechSynthesis"in window)speechSynthesis.cancel();let l=select.value;document.documentElement.lang=l;for(const k of ["title","message","listen","stop","status","disclaimer"])$(k).textContent=copy[l][k];$("listen").disabled=true;try{localStorage.setItem("agltv-language",l)}catch(e){}}select.addEventListener("change",show);$("stop").addEventListener("click",()=>{stopJingle();if("speechSynthesis"in window)speechSynthesis.cancel()});show();</script></body></html>
