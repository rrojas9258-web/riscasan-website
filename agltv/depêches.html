<!doctype html><html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGL Dépêches Audio</title><style>body{margin:0;font-family:system-ui;background:#eef4fb;color:#13284a}header{background:#081b39;color:#fff;padding:18px 6%}header a{color:#fff;text-decoration:none;font-weight:800}main{max-width:800px;margin:auto;padding:42px 20px}h1{font-size:clamp(2rem,5vw,3rem)}.card{background:#fff;border:1px solid #d7e4f2;border-radius:16px;padding:25px;margin:24px 0}select,button{padding:12px;border-radius:9px;font:inherit}button{background:#115a9e;border:0;color:#fff;font-weight:750;cursor:pointer;margin:5px}button:disabled{opacity:.6}.note{color:#647993;line-height:1.7}footer{text-align:center;padding:30px;background:#081b39;color:#adc8e7}</style></head><body><header><a href="index.html">AGL TÉLÉVISION</a></header><main><h1>🔊 AGL Dépêches Audio</h1><select id="lang" aria-label="Language"><option value="ht">Kreyòl</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option></select><div class="card"><h2 id="title"></h2><p id="message" class="note"></p><p class="note">📯 AGL — Son kòn pou nouvèl</p><audio id="jingleAudio" controls preload="auto" playsinline aria-label="AGL Jingle" style="width:100%;margin:10px 0 14px"></audio><button id="jingle" type="button">📯 Koute kòn AGL</button><button id="listen"></button><button id="stop"></button><p id="status" class="note" role="status"></p></div><p id="disclaimer" class="note"></p></main><footer>AGL — La rédaction</footer><script>const copy={ht:{title:"Dépêches chak èdtan",message:"Premye bilten odyo yo ap disponib isit la apre yo fin verifye epi pibliye. Nou pa gen dépêche pou li otomatikman kounye a.",listen:"▶ Koute dépêche",stop:"■ Kanpe",status:"Pa gen dépêche pibliye pou kounye a.",disclaimer:"Vèsyon sa a prepare sistèm odyo a; yon entegrasyon piblikasyon nesesè pou bilten chak èdtan parèt otomatikman."},en:{title:"Hourly news flashes",message:"Audio bulletins will appear here once verified and published. No bulletin is available for playback yet.",listen:"▶ Listen",stop:"■ Stop",status:"No published bulletins yet.",disclaimer:"Audio interface preview; an editorial publishing integration is required for automatic hourly delivery."},es:{title:"Boletines cada hora",message:"Los boletines de audio aparecerán aquí después de verificarse y publicarse. Aún no hay boletines para reproducir.",listen:"▶ Escuchar",stop:"■ Detener",status:"Aún no hay boletines publicados.",disclaimer:"Vista previa del sistema de audio; se necesita integrar la publicación editorial para actualizar los boletines automáticamente."},fr:{title:"Dépêches chaque heure",message:"Les bulletins audio paraîtront ici après vérification et publication. Aucun bulletin n'est encore disponible à l'écoute.",listen:"▶ Écouter",stop:"■ Arrêter",status:"Aucune dépêche publiée pour le moment.",disclaimer:"Aperçu de l'interface audio ; la publication automatique nécessite une intégration éditoriale."}};const $=s=>document.getElementById(s),select=$("lang");const player=$("jingleAudio");function makeJingle(){const rate=16000,duration=2.5,n=Math.round(rate*duration),bytes=new Uint8Array(44+n*2),view=new DataView(bytes.buffer);function tag(p,str){for(let i=0;i<str.length;i++)bytes[p+i]=str.charCodeAt(i)}tag(0,"RIFF");view.setUint32(4,36+n*2,true);tag(8,"WAVE");tag(12,"fmt ");view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,rate,true);view.setUint32(28,rate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);tag(36,"data");view.setUint32(40,n*2,true);const fanfare=[{hz:261.63,t:.10,len:.45},{hz:329.63,t:.58,len:.45},{hz:392,t:1.08,len:.43},{hz:523.25,t:1.54,len:.73}];for(let i=0;i<n;i++){let t=i/rate,v=0;for(const note of fanfare){const x=t-note.t;if(x>=0&&x<note.len){const env=Math.min(1,x/.045)*Math.min(1,(note.len-x)/.13);let brass=0;for(let h=1;h<=7;h++){brass+=(1/h)*Math.sin(2*Math.PI*note.hz*h*x+0.09*h)}v+=.16*env*Math.tanh(brass*1.15)}}view.setInt16(44+i*2,Math.round(32767*Math.max(-.92,Math.min(.92,v))),true)}return URL.createObjectURL(new Blob([bytes],{type:"audio/wav"}))}player.src=makeJingle();$("jingle").addEventListener("click",async()=>{try{player.currentTime=0;await player.play();$("status").textContent="📯 Kòn AGL"}catch(e){$("status").textContent="Pa kapab jwe son an. Peze Play sou ba odyo a, epi tcheke volim telefòn nan."}});try{const v=localStorage.getItem("agltv-language");if(copy[v])select.value=v}catch(e){}function show(){if("speechSynthesis"in window)speechSynthesis.cancel();let l=select.value;document.documentElement.lang=l;for(const k of ["title","message","listen","stop","status","disclaimer"])$(k).textContent=copy[l][k];$("listen").disabled=true;try{localStorage.setItem("agltv-language",l)}catch(e){}}select.addEventListener("change",show);$("stop").addEventListener("click",()=>{player.pause();player.currentTime=0;if("speechSynthesis"in window)speechSynthesis.cancel()});show();</script></body></html>
