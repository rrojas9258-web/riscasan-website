<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGL Weather | Météo</title><meta name="description" content="AGL Television weather: conditions, forecasts and city weather in four languages."><style>*{box-sizing:border-box}body{margin:0;background:#eff5fb;color:#142a48;font-family:system-ui,sans-serif}header{background:#071b3c;color:white;padding:18px 5%}nav{max-width:1100px;margin:auto;display:flex;flex-wrap:wrap;align-items:center;gap:20px}nav a{color:white;text-decoration:none;font-weight:750}nav a:first-child{margin-right:auto;letter-spacing:.1em}select,button,input{font:inherit;padding:12px;border-radius:9px;border:1px solid #bdd3e7}nav select{background:#1c446e;color:white}.hero{background:linear-gradient(115deg,#062048,#1873af);padding:65px 20px;color:white}.wrap{max-width:1100px;margin:auto;padding:0 18px}.hero h1{font-size:clamp(2.3rem,6vw,4rem);margin:8px 0}.hero p{color:#d9edff;line-height:1.7}.main{padding:40px 18px 70px}.card{border-radius:14px;background:#fff;border:1px solid #d7e4f0;padding:22px;margin-bottom:20px}.search{display:flex;flex-wrap:wrap;gap:10px}.search input{flex:1;min-width:200px}.search button{background:#125f9c;color:white;border:0;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid .card{margin:0}.temp{font-size:3rem;font-weight:850}.muted{color:#5e7791;font-size:.9rem;line-height:1.6}.citybtn{padding:10px 13px;margin:4px;border-radius:30px;background:#e7f2ff;border:1px solid #bdd8ef;cursor:pointer;color:#164874}.notice{padding:18px;background:#e3edf8;border-left:4px solid #197bb9;border-radius:9px;margin-top:23px;line-height:1.7}footer{background:#071b3c;color:#b5d0eb;padding:30px;text-align:center}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><nav><a href="index.html">AGL TÉLÉVISION</a><a id="home" href="index.html"></a><a id="news" href="articles.html"></a><select id="language" aria-label="Language"><option value="ht">Kreyòl</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option></select></nav></header><section class="hero"><div class="wrap"><div>☁️ AGL WEATHER</div><h1 id="title"></h1><p id="intro"></p></div></section><main class="wrap main"><div class="card"><form id="search" class="search"><input id="city" required placeholder="Port-au-Prince" aria-label="City"><button id="find" type="submit"></button></form><div style="margin-top:12px" id="cities"></div><p id="status" role="status" aria-live="polite" class="muted"></p></div><div id="weather" hidden><div class="card"><div id="place" style="font-size:1.2rem;font-weight:800"></div><div class="temp" id="temperature"></div><div id="details"></div><p class="muted" id="updated"></p></div><h2 id="forecastTitle"></h2><div id="forecast" class="grid"></div></div><p id="notice" class="notice"></p><div class="card"><h2 id="alertsTitle"></h2><p id="alertsText"></p><a href="https://www.weather.gov/alerts" target="_blank" rel="noopener noreferrer">U.S. National Weather Service ↗</a> · <a href="https://www.nhc.noaa.gov/" target="_blank" rel="noopener noreferrer">National Hurricane Center ↗</a> · <a href="https://public.wmo.int/" target="_blank" rel="noopener noreferrer">WMO ↗</a></div></main><footer>AGL TÉLÉVISION · Fenèt ou sou mond lan · AGL</footer><script>
const translations={
ht:{home:"Akèy",news:"Nouvèl",title:"Meteyo atravè lemond",intro:"Kondisyon aktyèl ak previzyon pou vil ou chwazi a. Enfòmasyon meteyo yo mete ajou lè sèvis done a disponib.",find:"Chèche vil",loading:"Ap chèche done meteyo yo...",fail:"Nou pa kapab jwenn done yo kounye a. Tcheke non vil la oswa eseye pita.",noCity:"Vil sa a pa jwenn. Eseye vil ak peyi a.",forecastTitle:"Previzyon 5 jou",notice:"Done yo sòti nan Open-Meteo. Paj la rafrechi chak 15 minit pandan li ouvri. Se pa yon sistèm alèt ijans ni yon garanti sou kondisyon tan an. Pou gwo danje, suiv sèvis meteyo ofisyèl kote ou ye a.",alertsTitle:"Alèt meteyo ak siklòn",alertsText:"Tcheke otorite meteyo peyi w pou avètisman ofisyèl. Lyen sa yo bay resous pou Etazini, siklòn Atlantik ak enfòmasyon mondyal.",updated:"Dènye rekèt",wind:"Van",humidity:"Imidite",rain:"Lapli",today:"Jodi a"},
en:{home:"Home",news:"News",title:"Weather around the world",intro:"Current conditions and forecasts for the city you choose. Weather data refreshes when the provider is available.",find:"Find city",loading:"Loading weather data...",fail:"Weather data is unavailable. Check the city name or try again later.",noCity:"City not found. Try city and country.",forecastTitle:"5-day forecast",notice:"Data comes from Open-Meteo. This page refreshes every 15 minutes while open. It is not an emergency warning service or a guarantee of conditions. Follow local official weather authorities for hazards.",alertsTitle:"Weather and hurricane alerts",alertsText:"Consult official local weather authorities for warnings. These links cover U.S. alerts, Atlantic hurricanes and global resources.",updated:"Last request",wind:"Wind",humidity:"Humidity",rain:"Rain",today:"Today"},
es:{home:"Inicio",news:"Noticias",title:"El tiempo en el mundo",intro:"Condiciones actuales y pronósticos para la ciudad que elijas. Los datos se actualizan según disponibilidad.",find:"Buscar ciudad",loading:"Consultando el tiempo...",fail:"Los datos no están disponibles. Comprueba la ciudad o inténtalo más tarde.",noCity:"No se encontró la ciudad. Prueba con ciudad y país.",forecastTitle:"Pronóstico de 5 días",notice:"Datos de Open-Meteo. La página se actualiza cada 15 minutos mientras esté abierta. No sustituye las alertas oficiales. Sigue los avisos de las autoridades meteorológicas locales.",alertsTitle:"Alertas meteorológicas y huracanes",alertsText:"Consulta a las autoridades locales para las alertas oficiales. Enlaces a servicios de EE. UU., huracanes del Atlántico y recursos mundiales.",updated:"Última consulta",wind:"Viento",humidity:"Humedad",rain:"Lluvia",today:"Hoy"},
fr:{home:"Accueil",news:"Actualités",title:"Météo dans le monde",intro:"Conditions actuelles et prévisions pour la ville de votre choix. Les données se mettent à jour selon leur disponibilité.",find:"Chercher une ville",loading:"Chargement de la météo...",fail:"Données indisponibles. Vérifiez le nom de la ville ou réessayez.",noCity:"Ville introuvable. Essayez ville et pays.",forecastTitle:"Prévisions sur 5 jours",notice:"Données fournies par Open-Meteo. Cette page se rafraîchit toutes les 15 minutes lorsqu'elle est ouverte. Elle ne remplace pas les alertes officielles. Consultez les services météo locaux pour les dangers.",alertsTitle:"Alertes météo et cyclones",alertsText:"Consultez les autorités météo locales pour les alertes officielles. Liens vers les alertes américaines, les ouragans atlantiques et les ressources mondiales.",updated:"Dernière consultation",wind:"Vent",humidity:"Humidité",rain:"Pluie",today:"Aujourd'hui"}};
const favourites=[["Port-au-Prince","Port-au-Prince"],["Santo Domingo","Santo Domingo"],["Bogotá","Bogotá"],["New York","New York"],["Miami","Miami"],["Montréal","Montréal"]];
const lang=document.getElementById("language"),$=id=>document.getElementById(id);let selected="Port-au-Prince",last=null;
try{const stored=localStorage.getItem("agltv-language");lang.value=translations[stored]?stored:"fr"}catch(e){}
function updateLanguage(){const l=lang.value,t=translations[l];document.documentElement.lang=l;for(const k of ["home","news","title","intro","find","forecastTitle","notice","alertsTitle","alertsText"])$(k).textContent=t[k];if(last)renderData(last);try{localStorage.setItem("agltv-language",l)}catch(e){}}
lang.addEventListener("change",updateLanguage);updateLanguage();const cityBox=$("cities");favourites.forEach(([name,query])=>{let b=document.createElement("button");b.className="citybtn";b.textContent=name;b.type="button";b.addEventListener("click",()=>loadWeather(query));cityBox.append(b)});
function renderData(data){let t=translations[lang.value],cur=data.weather.current; $("weather").hidden=false;$("place").textContent=data.name;$("temperature").textContent=Math.round(cur.temperature_2m)+"°C";$("details").textContent=t.wind+": "+Math.round(cur.wind_speed_10m)+" km/h · "+t.humidity+": "+cur.relative_humidity_2m+"%";$("updated").textContent=t.updated+": "+new Date().toLocaleString();$("forecast").replaceChildren();for(let i=0;i<Math.min(5,data.weather.daily.time.length);i++){let a=document.createElement("article");a.className="card";let h=document.createElement("h3");h.textContent=new Intl.DateTimeFormat(lang.value==="ht"?"fr-HT":lang.value,{weekday:"long",month:"short",day:"numeric"}).format(new Date(data.weather.daily.time[i]+"T12:00:00"));let p=document.createElement("p");p.textContent=data.weather.daily.temperature_2m_max[i]+"° / "+data.weather.daily.temperature_2m_min[i]+"°C";let rain=document.createElement("p");rain.className="muted";rain.textContent=t.rain+": "+data.weather.daily.precipitation_probability_max[i]+"%";a.append(h,p,rain);$("forecast").append(a)}}
async function loadWeather(query){selected=query;$("city").value=query;$("status").textContent=translations[lang.value].loading;try{const g=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(query)+"&count=1&language=en&format=json",{cache:"no-store"});if(!g.ok)throw Error("geocode");const geo=await g.json();if(!geo.results?.length){$("status").textContent=translations[lang.value].noCity;return}let p=geo.results[0];const url="https://api.open-meteo.com/v1/forecast?latitude="+encodeURIComponent(p.latitude)+"&longitude="+encodeURIComponent(p.longitude)+"&current=temperature_2m,relative_humidity_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=5";const w=await fetch(url,{cache:"no-store"});if(!w.ok)throw Error("weather");const weather=await w.json();if(!weather.current||!weather.daily)throw Error("data");last={name:p.name+", "+p.country,weather};$("status").textContent="";renderData(last)}catch(e){$("status").textContent=translations[lang.value].fail}}
$("search").addEventListener("submit",e=>{e.preventDefault();loadWeather($("city").value.trim())});loadWeather(selected);setInterval(()=>{if(!document.hidden)loadWeather(selected)},15*60*1000);
</script></body></html>
