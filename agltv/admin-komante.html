<!doctype html><html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Administrasyon kòmantè — AGL Télévision</title><style>*{box-sizing:border-box}body{font:16px/1.6 system-ui,-apple-system,sans-serif;background:#f2f6fb;color:#152b48;max-width:850px;margin:auto;padding:25px 16px}h1{font-size:1.7rem}header{display:flex;align-items:center;gap:15px;margin-bottom:25px}header img{width:150px}input{padding:12px;border:1px solid #adbed1;border-radius:8px;font:inherit;min-width:0;flex:1}button{background:#124d86;color:white;border:0;border-radius:8px;padding:11px 16px;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.bar,.actions{display:flex;flex-wrap:wrap;gap:10px}.bar{margin:20px 0}.card{background:white;padding:18px;border:1px solid #dce5ef;border-radius:12px;margin:12px 0;overflow-wrap:anywhere}.meta{font-size:.86rem;color:#536983}.body{white-space:pre-wrap;margin:12px 0}.danger{background:#ad2136}.status{padding:12px 0;min-height:24px}.hint{color:#586d86;font-size:.9rem}</style></head><body><header><a href="index.html"><img src="agl-logo.svg" alt="AGL Télévision"></a><h1>Administrasyon kòmantè</h1></header><p>Tout kòmantè pibliye imedyatman. Ou ka retire mesaj ki pa respekte règ AGL yo.</p><div class="bar"><input id="key" type="password" placeholder="Kle administratè" autocomplete="off" aria-label="Kle administratè"><button id="load" type="button">Chaje kòmantè</button></div><p class="hint">Pou sekirite, kle a rete nan memwa paj sa a sèlman; li pa sove nan navigatè a.</p><div id="status" class="status" role="status"></div><div id="list"></div><script>const API="https://agltv-comments.onrender.com",key=document.getElementById("key"),status=document.getElementById("status"),list=document.getElementById("list"),loadBtn=document.getElementById("load");function auth(){return {"x-admin-key":key.value}}async function load(){if(!key.value){status.textContent="Antre kle administratè a.";return}loadBtn.disabled=true;status.textContent="Ap chaje...";list.replaceChildren();try{const r=await fetch(API+"/api/admin/comments",{headers:auth(),cache:"no-store"});if(r.status===401)throw Error("Kle administratè a pa kòrèk.");if(!r.ok)throw Error("Sèvè a pa disponib kounye a.");const rows=await r.json();status.textContent=rows.length+" kòmantè";for(const c of rows){const card=document.createElement("article");card.className="card";const meta=document.createElement("div");meta.className="meta";meta.textContent=c.name+" · "+c.article_id+" · "+new Date(c.created_at).toLocaleString("fr-FR");const body=document.createElement("div");body.className="body";body.textContent=c.body;const actions=document.createElement("div");actions.className="actions";const del=document.createElement("button");del.className="danger";del.textContent="Efase kòmantè";del.onclick=async()=>{if(!confirm("Èske ou vle efase kòmantè sa a nèt?"))return;del.disabled=true;try{const rr=await fetch(API+"/api/admin/comments/"+encodeURIComponent(c.id),{method:"DELETE",headers:auth()});if(!rr.ok)throw Error("Pa ka efase kòmantè a.");card.remove();status.textContent="Kòmantè efase."}catch(e){status.textContent=e.message;del.disabled=false}};actions.append(del);card.append(meta,body,actions);list.append(card)}}catch(e){status.textContent=e.message||"Erè koneksyon."}finally{loadBtn.disabled=false}}loadBtn.onclick=load;key.addEventListener("keydown",e=>{if(e.key==="Enter")load()});</script></body></html>
